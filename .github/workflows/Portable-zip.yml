name: Build Windows Portable ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, unified-scheduler]

concurrency:
  group: portable-zip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Portable x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node (latest stable, npm store cache)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Cache Electron + electron-builder toolsets
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            eb-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=@getpaseo/app

      - name: Build server workspaces + desktop main
        shell: bash
        run: |
          npm run build:server:clean
          npm run build:main --workspace=@getpaseo/desktop

      # --win zip  = build ONLY the zip target (per electron-builder CLI help:
      # "--win accepts target list").  --x64 = x64 arch only.
      # No NSIS installer, no arm64.
      - name: Package x64 ZIP only (no arm64, no NSIS)
        working-directory: packages/desktop
        shell: bash
        run: npx electron-builder --config electron-builder.yml --win zip --x64 --publish never

      - name: Verify release output
        shell: bash
        run: |
          ls -la packages/desktop/release || true
          find packages/desktop/release -name "Paseo-Setup-*-x64.zip" | grep -q . || { echo "x64 zip not found"; exit 1; }

      - name: Publish portable zip to GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portable-win-x64-latest
          name: Paseo Windows x64 portable
          draft: false
          generate_release_notes: false
          files: packages/desktop/release/Paseo-Setup-*-x64.zip

      - name: Extract portable zip (flatten for artifact)
        if: github.event_name == 'push'
        working-directory: packages/desktop/release
        shell: pwsh
        run: |
          $z = (Get-ChildItem "Paseo-Setup-*-x64.zip" | Select-Object -First 1).FullName
          Expand-Archive -Path $z -DestinationPath "portable-x64" -Force

      - name: Upload portable (folder) artifact (push runs)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: Paseo-Windows-Portable-x64
          path: packages/desktop/release/portable-x64
          if-no-files-found: error
          retention-days: 3
