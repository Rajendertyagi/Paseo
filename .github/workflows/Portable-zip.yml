name: Build Windows Portable ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, unified-scheduler]

concurrency:
  group: portable-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@getpaseo/app
      - run: npm run build --workspace=@getpaseo/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Paseo-Windows-Portable-x64
          path: packages/desktop/release/*x64*.zip
          if-no-files-found: error
          retention-days: 3
