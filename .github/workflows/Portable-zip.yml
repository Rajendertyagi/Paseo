name: Build Windows Portable ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, unified-scheduler]

concurrency:
  group: portable-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=@getpaseo/app

      - name: Build desktop
        run: npm run build --workspace=@getpaseo/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release output
        shell: bash
        run: |
          echo "Release directory contents:"
          ls -la packages/desktop/release || true

      - name: Upload portable release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Paseo-Windows-Portable-x64
          path: packages/desktop/release/Paseo-Windows-Portable-x64.zip
          if-no-files-found: error
          retention-days: 3
