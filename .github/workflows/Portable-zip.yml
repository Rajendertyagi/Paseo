name: Build Windows Portable ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, unified-scheduler]

concurrency:
  group: portable-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows Portable x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      # Pin electron/electron-builder download caches to workspace paths so
      # actions/cache can save/restore them deterministically
      # (documented pattern from electron-builder docs).
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v7 = current major; pinned to Node 22 to match upstream CI
      # (their ci.yml runs node 22 everywhere — lts/* had drifted to 24).
      - name: Setup Node (pin 22, npm store cache)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron zip + 7zip/toolsets — seeded on run 1, ~0s restore after.
      - name: Cache Electron + electron-builder toolsets
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            eb-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Original order kept (web app first, then server deps + workspaces):
      # both write into shared node_modules/.cache, so running them in
      # parallel risks corrupting each other's build caches.
      - name: Build web app
        run: npm run build --workspace=@getpaseo/app

      # build:server:clean (root) covers protocol -> client ->
      # [highlight, plugin, relay in parallel] -> server, then tsc the
      # desktop main process — exactly what the old `build` script did,
      # minus the electron-builder part below.
      - name: Build server workspaces + desktop main
        shell: bash
        run: |
          npm run build:server:clean
          npm run build:main --workspace=@getpaseo/desktop

      # x64 + zip target ONLY: no arm64, no NSIS installers at all.
      # `--publish never` makes it explicit that no release/upload happens.
      - name: Package x64 ZIP only (no arm64, no NSIS)
        working-directory: packages/desktop
        shell: bash
        run: npx electron-builder --config electron-builder.yml --win --x64 --zip --publish never

      - name: Verify release output
        shell: bash
        run: |
          echo "Release directory contents:"
          ls -la packages/desktop/release || true
          # Fail early if the zip didn't land
          find packages/desktop/release -name "Paseo-Setup-*-x64.zip" | grep -q . || { echo "x64 zip not found"; exit 1; }

      - name: Upload portable x64 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Paseo-Windows-Portable-x64
          path: packages/desktop/release/Paseo-Setup-*-x64.zip
          if-no-files-found: error
          retention-days: 3
